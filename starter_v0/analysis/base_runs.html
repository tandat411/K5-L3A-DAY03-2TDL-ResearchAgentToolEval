<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base Runs Log Viewer — starter_v0</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #fbfaf7;
      --surface-alt: #f0ede6;
      --border: #e2ddd3;
      --text: #333632;
      --muted: #6e726b;
      --accent: #5b7065;
      --pass-bg: #e6efe9;
      --pass-text: #355e46;
      --fail-bg: #f5e6e4;
      --fail-text: #8a433b;
      --warn-bg: #f3ece0;
      --warn-text: #7a5c32;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 24px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      align-items: center;
    }

    input[type="search"], select, .file-label {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
      font-size: 13px;
      outline: none;
    }

    input[type="search"] {
      flex: 1 1 260px;
    }

    input[type="search"]:focus, select:focus {
      border-color: var(--accent);
    }

    .file-label {
      cursor: pointer;
      color: var(--muted);
      user-select: none;
    }

    .file-label:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      background: var(--surface-alt);
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f4f1ea; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge-pass { background: var(--pass-bg); color: var(--pass-text); }
    .badge-fail { background: var(--fail-bg); color: var(--fail-text); }
    .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
    .badge-neutral { background: var(--surface-alt); color: var(--muted); }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      background: var(--surface-alt);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .failure-msg {
      color: var(--fail-text);
      font-size: 12.5px;
      max-width: 360px;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Evaluation Log Viewer</h1>
        <div class="subtitle" id="meta-info">Source: <code>starter_v0/analysis/base_runs.csv</code></div>
      </div>
      <label class="file-label" title="Load another CSV file">
        📂 Load CSV khác
        <input type="file" id="csv-file" accept=".csv" hidden />
      </label>
    </header>

    <div class="stats" id="stats"></div>

    <div class="controls">
      <input type="search" id="search" placeholder="Search case_id, tool, failure, mismatch..." />
      <select id="status-filter">
        <option value="all">Status: All</option>
        <option value="True">Passed only</option>
        <option value="False">Failed only</option>
      </select>
      <select id="type-filter">
        <option value="all">Failure Type: All</option>
      </select>
      <select id="turn-filter">
        <option value="all">Turns: All</option>
        <option value="False">Single-turn</option>
        <option value="True">Multi-turn</option>
      </select>
      <select id="version-filter">
        <option value="all">Version: All</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ver</th>
            <th>Case ID</th>
            <th>Turn</th>
            <th>Status</th>
            <th>Expected → Actual Tool</th>
            <th>Routing / Args</th>
            <th>Case Failure Type</th>
            <th>Observed Mismatch</th>
            <th>Failures Detail</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let allRows = [];

    function parseCSVLine(line) {
      const out = [];
      let cur = "", inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          out.push(cur); cur = "";
        } else {
          cur += ch;
        }
      }
      out.push(cur);
      return out;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const headers = parseCSVLine(lines[0]);
      return lines.slice(1).map(line => {
        const vals = parseCSVLine(line);
        const obj = {};
        headers.forEach((h, i) => obj[h] = vals[i] ?? "");
        return obj;
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function populateFilters(rows) {
      const types = [...new Set(rows.map(r => r.case_failure_type).filter(Boolean))].sort();
      const versions = [...new Set(rows.map(r => r.version).filter(Boolean))].sort();
      const typeSel = document.getElementById("type-filter");
      const verSel = document.getElementById("version-filter");
      typeSel.innerHTML = '<option value="all">Failure Type: All</option>' +
        types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
      verSel.innerHTML = '<option value="all">Version: All</option>' +
        versions.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
    }

    function render() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const status = document.getElementById("status-filter").value;
      const type = document.getElementById("type-filter").value;
      const turn = document.getElementById("turn-filter").value;
      const ver = document.getElementById("version-filter").value;

      const filtered = allRows.filter(r => {
        if (status !== "all" && r.passed !== status) return false;
        if (type !== "all" && r.case_failure_type !== type) return false;
        if (turn !== "all" && r.is_multiturn !== turn) return false;
        if (ver !== "all" && r.version !== ver) return false;
        if (q) {
          const hay = [
            r.case_id, r.expected_tool, r.actual_tool,
            r.case_failure_type, r.observed_mismatch, r.failures, r.version
          ].join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const total = filtered.length;
      const passed = filtered.filter(r => r.passed === "True").length;
      const failed = total - passed;
      const routingOk = filtered.filter(r => r.routing_correct === "True").length;
      const argsOk = filtered.filter(r => r.args_correct === "True").length;
      const pct = n => total ? Math.round((n / total) * 100) + "%" : "0%";

      document.getElementById("stats").innerHTML = `
        <div class="stat-card"><div class="stat-label">Showing Cases</div><div class="stat-value">${total} / ${allRows.length}</div></div>
        <div class="stat-card"><div class="stat-label">Passed</div><div class="stat-value" style="color:var(--pass-text)">${passed} (${pct(passed)})</div></div>
        <div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value" style="color:var(--fail-text)">${failed}</div></div>
        <div class="stat-card"><div class="stat-label">Routing Correct</div><div class="stat-value">${pct(routingOk)}</div></div>
        <div class="stat-card"><div class="stat-label">Args Correct</div><div class="stat-value">${pct(argsOk)}</div></div>
      `;

      const tbody = document.getElementById("tbody");
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="empty">Không có dòng nào khớp bộ lọc.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const isPass = r.passed === "True";
        const expected = r.expected_tool || "—";
        const actual = r.actual_tool || "no_tool";
        return `
          <tr>
            <td><span class="badge badge-neutral">${esc(r.version)}</span></td>
            <td><strong>${esc(r.case_id)}</strong></td>
            <td><span class="badge badge-neutral">${r.is_multiturn === "True" ? "Multi" : "Single"}</span></td>
            <td><span class="badge ${isPass ? "badge-pass" : "badge-fail"}">${isPass ? "PASS" : "FAIL"}</span></td>
            <td><code>${esc(expected)}</code> → <code>${esc(actual)}</code></td>
            <td>
              <span class="badge ${r.routing_correct === "True" ? "badge-pass" : "badge-fail"}">R:${r.routing_correct === "True" ? "✓" : "✗"}</span>
              <span class="badge ${r.args_correct === "True" ? "badge-pass" : "badge-fail"}">A:${r.args_correct === "True" ? "✓" : "✗"}</span>
            </td>
            <td><span class="badge badge-neutral">${esc(r.case_failure_type)}</span></td>
            <td>${r.observed_mismatch ? `<span class="badge badge-warn">${esc(r.observed_mismatch)}</span>` : "—"}</td>
            <td class="failure-msg">${esc(r.failures) || "—"}</td>
          </tr>
        `;
      }).join("");
    }

    function loadText(text, label) {
      allRows = parseCSV(text);
      populateFilters(allRows);
      render();
      if (label) {
        document.getElementById("meta-info").innerHTML = `Source: <code>${esc(label)}</code> (${allRows[0]?.artifact_version || ""})`;
      }
    }

    ["search", "status-filter", "type-filter", "turn-filter", "version-filter"].forEach(id => {
      document.getElementById(id).addEventListener("input", render);
      document.getElementById(id).addEventListener("change", render);
    });

    document.getElementById("csv-file").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      file.text().then(t => loadText(t, file.name));
    });

    // Load fallback first (works with file://), then try live fetch if served over HTTP
    loadText(document.getElementById("fallback-csv").textContent, "starter_v0/analysis/base_runs.csv");
    fetch("./base_runs.csv")
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(t => loadText(t, "starter_v0/analysis/base_runs.csv (live)"))
      .catch(() => {});
  </script>
